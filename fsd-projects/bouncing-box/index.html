<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 70px;
      height: 70px;
      background-color: teal;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 0px;
    }

    .board {
      height: 100vh;
    }
  </style>
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box"); // reference to the HTML .box element
      var board = jQuery(".board"); // reference to the HTML .board element
      var boardWidth = board.width(); // the maximum X-Coordinate of the screen

      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
      });

      // moves the Box to a new position on the screen along the X-Axis
      function moveBoxTo(newPositionX) {
        box.css("left", newPositionX);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        box.text(newText);
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      // TODO 2 - Variable declarations
      var positionX = 0; // current x position of the box
      var points = 0;    // points scored
      var speed = 10;    // initial speed of the box

      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */
      function update() {
        // move the box
        positionX += speed;

        // bounce off right wall
        if (positionX > boardWidth - 70) { // subtract box width to stay inside
          speed *= -1;
        }
        // bounce off left wall
        if (positionX < 0) {
          speed *= -1;
        }

        // update the position
        moveBoxTo(positionX);
      }

      /**
       * This Function will be called each time the box is clicked.
       * It should:
       * - increase points
       * - increase speed
       * - reset positionX to 0
       */
      function handleBoxClick() {
        // reset position
        positionX = 0;
        // increase points
        points++;
        // update box text to show points
        changeBoxText(points);
        // increase speed linearly
        speed = 3 * points + 10;
      }

      // Set interval for update function
      setInterval(update, 50); // 20 times per second

      // Bind click event
      box.on("click", handleBoxClick);

    })();
  </script>
</body>

</html>
